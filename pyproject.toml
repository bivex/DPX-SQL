[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dpx-sql"
version = "0.1.0"
description = "Architectural pattern detector and static analysis engine for SQL schemas, queries, and stored procedures (PostgreSQL, MySQL, SQLite, T-SQL, PL/SQL, ANSI SQL)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Bivex Team", email = "dev@bivex.io" }
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
dpx-sql = "pattern_detector.adapters.inbound.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pattern_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
